kind: 流量回放
owner: Continuum-AI-Corp
repo: OrcaReplay
desc: '在 AI Agent 与模型服务之间的 HTTP 边界录下整次运行，再把录像喂回去离线复现：不调用模型、不需要 API key，Agent 自己的代码照常执行。注意只阻断模型侧出网，录下的工具调用仍会真的再执行一次，不是沙箱'
desc_en: 'Record an AI agent run at the HTTP boundary to its model provider, then replay it offline with no provider called and no API key. Blocks provider egress only — recorded tool calls still execute for real, so it is not a sandbox'
